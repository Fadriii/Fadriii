
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320">
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop offset="0" stop-color="#111b32"/>
      <stop offset=".55" stop-color="#39445f"/>
      <stop offset="1" stop-color="#9b9caf"/>
    </linearGradient>
    <linearGradient id="snow" x2=".8" y2="1">
      <stop stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#b8c7d7"/>
    </linearGradient>
    <linearGradient id="rock" x2="1" y2="1">
      <stop stop-color="#69778a"/>
      <stop offset=".5" stop-color="#465469"/>
      <stop offset="1" stop-color="#28374b"/>
    </linearGradient>
    <linearGradient id="valley" x2="0" y2="1">
      <stop stop-color="#526b68"/>
      <stop offset="1" stop-color="#1c3438"/>
    </linearGradient>
    <clipPath id="frame">
      <rect width="1000" height="320" rx="8"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- Evening sky -->
    <rect width="1000" height="320" fill="url(#sky)"/>
    <circle cx="812" cy="57" r="20" fill="#e4e1db" opacity=".8"/>
    <circle cx="820" cy="51" r="20" fill="#39445f"/>

    <!-- Small, understated stars -->
    <g fill="#f1f1ee">
      <circle cx="76" cy="42" r="1.3"/>
      <circle cx="164" cy="79" r="1"/>
      <circle cx="246" cy="35" r="1.5"/>
      <circle cx="347" cy="67" r="1"/>
      <circle cx="421" cy="30" r="1.2"/>
      <circle cx="527" cy="54" r="1.3"/>
      <circle cx="603" cy="36" r="1"/>
      <circle cx="704" cy="83" r="1.2"/>
      <circle cx="917" cy="43" r="1.3"/>
      <circle cx="954" cy="105" r="1"/>
      <circle cx="105" cy="120" r="1"/>
      <circle cx="286" cy="112" r="1.2"/>
      <circle cx="576" cy="105" r="1"/>
      <circle cx="742" cy="28" r="1.1"/>
      <animate attributeName="opacity" values=".85;1;.7;.85"
        dur="5s" repeatCount="indefinite"/>
    </g>

    <!-- Fine cloud bands -->
    <g fill="#c8cad5" opacity=".16">
      <path d="M20 104 Q85 90 155 101 T285 99 L285 104 Q190 110 100 106Z"/>
      <path d="M520 124 Q605 110 690 121 T815 120 L815 125 Q700 130 600 127Z"/>
      <path d="M220 146 Q285 139 340 146 T405 145 L405 148 Q310 152 220 149Z"/>
      <animateTransform attributeName="transform" type="translate"
        values="-12 0;12 0;-12 0" dur="32s" repeatCount="indefinite"/>
    </g>

    <!-- Far mountain silhouettes -->
    <path d="M0 227 L72 184 L123 204 L205 151
      L270 197 L350 128 L419 192 L495 144
      L557 194 L632 153 L698 199 L781 143
      L850 193 L928 151 L1000 191 L1000 320 L0 320Z"
      fill="#778398" opacity=".66"/>

    <!-- Main mountain chain -->
    <path d="M0 266 L92 211 L150 239 L236 141
      L284 178 L365 81 L411 143 L470 36
      L529 127 L565 172 L646 91 L700 164
      L777 53 L835 129 L885 181 L947 113
      L1000 158 L1000 320 L0 320Z"
      fill="url(#rock)"/>

    <!-- Left peak: irregular snowfields -->
    <path d="M236 141 L215 171 L230 166 L240 176
      L250 160 L261 172 L284 178 L268 158
      L253 153 L243 145Z"
      fill="url(#snow)"/>
    <path d="M236 141 L244 160 L230 166 L240 176
      L250 160 L261 172 L251 149Z"
      fill="#dce5ed"/>

    <!-- Central high peak -->
    <path d="M470 36 L437 88 L449 82 L458 98
      L469 78 L481 91 L493 111 L487 87
      L478 65Z"
      fill="url(#snow)"/>
    <path d="M470 36 L478 65 L487 87 L493 111
      L515 148 L498 119 L482 90Z"
      fill="#aab9cb"/>
    <path d="M437 88 L411 143 L437 126 L449 133
      L458 112 L469 122 L481 140 L470 109
      L458 98 L449 82Z"
      fill="#e1e8ef"/>
    <path d="M449 133 L458 112 L469 122 L481 140
      L465 134 L457 144Z"
      fill="#a5b4c5"/>

    <!-- Right-hand summit -->
    <path d="M777 53 L749 96 L764 88 L776 103
      L788 83 L803 99 L819 117 L810 90
      L795 72Z"
      fill="url(#snow)"/>
    <path d="M777 53 L795 72 L810 90 L819 117
      L837 132 L819 99 L803 80Z"
      fill="#aab9ca"/>
    <path d="M749 96 L723 133 L747 123 L759 132
      L776 113 L788 124 L803 139 L788 106
      L776 103 L764 88Z"
      fill="#d5e0eb"/>

    <!-- Natural rock ribs and shadow faces -->
    <g fill="#26354a" opacity=".45">
      <path d="M365 81 L376 131 L354 163 L384 145 L398 158 L411 143Z"/>
      <path d="M470 36 L481 91 L510 142 L529 164 L505 119 L487 87Z"/>
      <path d="M646 91 L651 130 L635 159 L661 145 L680 168 L700 164Z"/>
      <path d="M777 53 L783 95 L766 121 L792 110 L819 129 L835 129Z"/>
      <path d="M947 113 L955 150 L935 176 L966 158 L1000 176 L1000 158Z"/>
    </g>

    <!-- Lower forested slopes -->
    <path d="M0 263 L103 237 L174 257 L261 222
      L340 247 L429 215 L506 252 L596 215
      L677 251 L771 210 L856 251 L934 215
      L1000 234 L1000 320 L0 320Z"
      fill="#344c51"/>

    <!-- Distant pine forests -->
    <g fill="#213a3d" opacity=".8">
      <path d="M35 278 l10 -22 10 22 h-6 l11 17 h-30 l11 -17Z"/>
      <path d="M68 284 l12 -27 12 27 h-7 l12 17 h-34 l12 -17Z"/>
      <path d="M113 281 l9 -20 9 20 h-5 l9 15 h-26 l9 -15Z"/>
      <path d="M155 290 l12 -27 12 27 h-7 l12 17 h-34 l12 -17Z"/>
      <path d="M209 283 l10 -22 10 22 h-6 l11 17 h-30 l11 -17Z"/>
      <path d="M257 291 l11 -24 11 24 h-6 l10 15 h-30 l10 -15Z"/>
      <path d="M726 287 l11 -24 11 24 h-6 l10 16 h-30 l10 -16Z"/>
      <path d="M764 281 l12 -28 12 28 h-7 l12 18 h-34 l12 -18Z"/>
      <path d="M814 290 l10 -22 10 22 h-6 l10 15 h-28 l10 -15Z"/>
      <path d="M858 283 l12 -28 12 28 h-7 l12 18 h-34 l12 -18Z"/>
      <path d="M915 289 l10 -23 10 23 h-6 l10 15 h-28 l10 -15Z"/>
      <path d="M957 280 l12 -27 12 27 h-7 l11 18 h-32 l11 -18Z"/>
    </g>

    <!-- Alpine valley -->
    <path d="M0 298 Q120 268 238 295
      T480 289 T735 288 T1000 280
      L1000 320 L0 320Z"
      fill="url(#valley)"/>
    <path d="M0 309 Q150 292 310 307
      T650 302 T1000 301 L1000 320 L0 320Z"
      fill="#192f35"/>

    <!-- A few distant snowflakes -->
    <g fill="#fff" opacity=".65">
      <circle cx="98" cy="12" r="1.5">
        <animate attributeName="cy" values="12;318" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="302" cy="-25" r="1.4">
        <animate attributeName="cy" values="-25;318" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle cx="584" cy="8" r="1.6">
        <animate attributeName="cy" values="8;318" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle cx="731" cy="-18" r="1.3">
        <animate attributeName="cy" values="-18;318" dur="17s" repeatCount="indefinite"/>
      </circle>
      <circle cx="864" cy="25" r="1.5">
        <animate attributeName="cy" values="25;318" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Flagpole -->
    <g transform="translate(911 226)">
      <path d="M2 0 L2 78" stroke="#d6d7d5" stroke-width="3"/>
      <circle cx="2" cy="-1" r="3" fill="#d8d9d7"/>
      <path d="M-3 79 L7 79 L11 82 L-7 82Z" fill="#16282d"/>

      <!-- Square Swiss flag: 44 x 44, centred white cross -->
      <g transform="translate(4 3)">
        <rect width="44" height="44" fill="#d52b32"/>
        <path d="M17 8 H27 V17 H36 V27 H27 V36 H17 V27 H8 V17 H17Z"
          fill="#fff"/>
      </g>
    </g>
  </g>
</svg>
